<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avance de obra</title>
<style>
  :root{
    --bg:#12161c; --card:#1b212a; --line:#2c3540; --txt:#e8ecf1;
    --mut:#8c98a8; --ok:#2fa76a; --warn:#d9a020; --bad:#d9534f; --prog:#5b7fa6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
       font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       padding:16px;max-width:820px;margin:0 auto}
  header{margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:14px}
  h1{font-size:22px;letter-spacing:-.3px}
  .sub{color:var(--mut);font-size:13px;margin-top:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  .kpi .lbl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .kpi .val{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);
     margin:22px 0 10px}
  .rubro{margin-bottom:14px}
  .rubro .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
  .bar{position:relative;height:16px;background:var(--card);border-radius:8px;
       border:1px solid var(--line);overflow:hidden}
  .fill{height:100%;border-radius:8px 0 0 8px}
  .mark{position:absolute;top:-3px;width:2px;height:22px;background:var(--prog)}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;
        font-weight:700}
  .alert{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);
         border-radius:8px;padding:12px;margin-bottom:8px}
  .alert .t{font-weight:700;font-size:14px}
  .alert .d{color:var(--mut);font-size:13px;margin-top:3px}
  footer{margin-top:28px;color:var(--mut);font-size:12px;text-align:center;
         border-top:1px solid var(--line);padding-top:14px}
  .nd{color:var(--mut);font-style:italic}
</style>
</head>
<body>
<header>
  <h1 id="obra">—</h1>
  <div class="sub" id="meta">cargando…</div>
</header>
<div id="app"></div>
<footer id="pie"></footer>

<script>
const pct = v => (v === null || v === undefined) ? null : Math.round(v * 1000) / 10;
const color = d => d >= -0.005 ? 'var(--ok)' : (d >= -0.05 ? 'var(--warn)' : 'var(--bad)');
const nd = '<span class="nd">sin datos</span>';

function kpi(lbl, val, col) {
  return `<div class="kpi"><div class="lbl">${lbl}</div>
    <div class="val" style="color:${col || 'var(--txt)'}">${val}</div></div>`;
}

function barra(r) {
  const real = pct(r.real), prog = pct(r.programado);
  if (real === null) return `<div class="rubro"><div class="top"><span>${r.nombre}</span>${nd}</div></div>`;
  const d = (r.real ?? 0) - (r.programado ?? 0);
  return `<div class="rubro">
    <div class="top"><span>${r.nombre}</span>
      <span style="color:${color(d)}">${real}%${prog !== null ? ` <span style="color:var(--mut)">/ ${prog}%</span>` : ''}</span>
    </div>
    <div class="bar">
      <div class="fill" style="width:${Math.min(real,100)}%;background:${color(d)}"></div>
      ${prog !== null ? `<div class="mark" style="left:${Math.min(prog,100)}%"></div>` : ''}
    </div></div>`;
}

fetch('datos.json?' + Date.now()).then(r => r.json()).then(d => {
  document.getElementById('obra').textContent = `${d.codigo || ''} · ${d.obra || ''}`;
  document.getElementById('meta').textContent =
    `Actualizado ${d.actualizado || 's/f'}` +
    (d.plazo ? ` · día ${d.plazo.dias_transcurridos ?? '?'} de ${d.plazo.dias ?? '?'}` : '');

  const a = d.avance || {}, s = d.seguridad || {};
  const gr = a.global_real, gp = a.global_programado;
  const desv = (gr != null && gp != null) ? gr - gp : null;

  let h = '<div class="grid">' +
    kpi('Avance real', gr != null ? pct(gr) + '%' : 'sin datos') +
    kpi('Programado', gp != null ? pct(gp) + '%' : 'sin datos', 'var(--prog)') +
    kpi('Desvío', desv != null ? (desv >= 0 ? '+' : '') + pct(desv) + '%' : 'sin datos',
        desv != null ? color(desv) : null) +
    kpi('Días sin incidentes', s.dias_sin_incidentes ?? 'sin datos') +
    '</div>';

  if ((a.rubros || []).length) {
    h += '<h2>Avance por rubro</h2>' + a.rubros.map(barra).join('');
  }

  if ((d.materiales || []).length) {
    h += '<h2>Desvío de materiales</h2>';
    h += d.materiales.map(m => {
      const c = m.estado === 'rojo' ? 'var(--bad)' : m.estado === 'amarillo' ? 'var(--warn)' : 'var(--ok)';
      const v = m.desvio_pct == null ? 'sin datos' :
        (m.desvio_pct >= 0 ? '+' : '') + pct(m.desvio_pct) + '%';
      return `<div class="rubro"><div class="top"><span>${m.nombre}</span>
        <span class="pill" style="background:${c};color:#0d1116">${v}</span></div></div>`;
    }).join('');
  }

  if ((d.alertas || []).length) {
    h += '<h2>Pendientes y alertas</h2>';
    h += d.alertas.map(x => `<div class="alert"><div class="t">${x.titulo || ''}</div>
      <div class="d">${x.detalle || ''}${x.responsable ? ' — ' + x.responsable : ''}
      ${x.desde ? ' · desde ' + x.desde : ''}</div></div>`).join('');
  }

  document.getElementById('app').innerHTML = h;
  document.getElementById('pie').textContent =
    'Avance físico y seguridad. No contiene información económica.';
}).catch(e => {
  document.getElementById('app').innerHTML =
    '<div class="alert"><div class="t">No se pudo cargar datos.json</div>' +
    '<div class="d">Verificá que el archivo esté junto al index.html.</div></div>';
});
</script>
</body>
</html>
